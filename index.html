<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="theme-color"
    content="#050505"
  >
  <link
    rel="manifest"
    href="manifest.json"
  >
  <link
    rel="stylesheet"
    href="styles.css"
  >
  <title>MyDetail — Five Star Detail</title>
</head>
<body>
  <!-- TOP BAR -->
  <header class="topbar">
    <div>
      <div class="eyebrow">
        FIVE STAR DETAIL
      </div>
      <h1>
        MyDetail
      </h1>
    </div>
    <span class="status">
      LIVE
    </span>
  </header>
  <!-- MAIN CONTENT -->
  <main>
    <!-- DASHBOARD HEADER -->
    <section class="hero">
      <p class="eyebrow">
        BUSINESS MANAGEMENT
      </p>
      <h2>
        Dashboard
      </h2>
      <p>
        Manage your detailing business from one place.
      </p>
    </section>
    <!-- BUSINESS STATS -->
    <section class="stats">
      <div class="card">
        <span>
          EMPLOYEES ONLINE
        </span>
        <strong id="employeesOnline">
          0
        </strong>
      </div>
      <div class="card">
        <span>
          OPEN JOBS
        </span>
        <strong id="openJobs">
          0
        </strong>
      </div>
      <div class="card">
        <span>
          REVENUE
        </span>
        <strong id="revenue">
          $0
        </strong>
      </div>
      <div class="card">
        <span>
          LIVE UPDATES
        </span>
        <strong id="updates">
          0
        </strong>
      </div>
    </section>
    <!-- EMPLOYEES -->
    <section class="card">
      <h3>
        Employee Status
      </h3>
      <div id="employeeList">
      </div>
    </section>
    <!-- WEEKLY REPORT -->
    <section class="card">
      <h3>
        Weekly Business Performance
      </h3>
      <div class="chart">
        <div
          class="bar"
          style="height:40%"
        ></div>
        <div
          class="bar"
          style="height:60%"
        ></div>
        <div
          class="bar"
          style="height:45%"
        ></div>
        <div
          class="bar"
          style="height:75%"
        ></div>
        <div
          class="bar"
          style="height:65%"
        ></div>
        <div
          class="bar"
          style="height:90%"
        ></div>
        <div
          class="bar"
          style="height:70%"
        ></div>
      </div>
      <div class="days">
        <span>MON</span>
        <span>TUE</span>
        <span>WED</span>
        <span>THU</span>
        <span>FRI</span>
        <span>SAT</span>
        <span>SUN</span>
      </div>
    </section>
  </main>
  <!-- JAVASCRIPT -->
  <script src="app.js"></script>
</body>
</html>
