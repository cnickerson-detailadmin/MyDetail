<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MyService">
  <link rel="manifest" href="manifest.json">
  <title>Install MyService</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f8ff;color:#10213d;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(460px,100%);background:#fff;border:1px solid #dbe8f8;border-radius:28px;padding:30px;box-shadow:0 18px 50px rgba(20,70,140,.12);text-align:center}
    .logo{font-size:38px;font-weight:800;letter-spacing:-1.5px;margin:4px 0 8px}.logo span{color:#1677ff}
    h1{font-size:25px;margin:12px 0 8px}p{line-height:1.5;color:#60738f;margin:0 0 22px}
    button,a.action{width:100%;border:0;border-radius:16px;padding:15px 18px;font-size:16px;font-weight:750;cursor:pointer;text-decoration:none;display:block}
    #installBtn{background:#1677ff;color:#fff}.secondary{margin-top:10px;background:#eef5ff;color:#145ec1}
    .ios{display:none;text-align:left;background:#f7faff;border-radius:16px;padding:16px;margin-top:16px;color:#334b68;line-height:1.55}
    .small{font-size:13px;margin-top:16px;color:#8797aa}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">My<span>Service</span></div>
    <h1>Install MyService</h1>
    <p>Use MyService from your Home Screen like an app.</p>

    <button id="installBtn" type="button">Install MyService</button>
    <div id="iosHelp" class="ios">
      <strong>Install on iPhone or iPad</strong><br>
      1. Tap the <strong>Share</strong> button in Safari.<br>
      2. Tap <strong>Add to Home Screen</strong>.<br>
      3. Tap <strong>Add</strong>.
    </div>

    <a id="continueBtn" class="action secondary" href="./">Continue in browser</a>
    <button id="desktopAccessBtn" class="action secondary" type="button">Request desktop access</button>
    <div class="small">Desktop visitors are not redirected here.</div>
  </main>

  <script>
    let deferredPrompt = null;
    const installBtn = document.getElementById("installBtn");
    const iosHelp = document.getElementById("iosHelp");
    const continueBtn = document.getElementById("continueBtn");
    const desktopAccessBtn = document.getElementById("desktopAccessBtn");
    const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isAndroid = /Android/i.test(navigator.userAgent);

    const params = new URLSearchParams(location.search);
    const continueTarget = params.get("continue");
    if (continueTarget && continueTarget.startsWith("/")) {
      continueBtn.href = continueTarget;
    }

    if (isiOS) {
      installBtn.textContent = "Show iPhone install steps";
    } else if (isAndroid) {
      installBtn.textContent = "Install MyService";
    } else {
      installBtn.textContent = "Continue to MyService";
    }

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
    });

    installBtn.addEventListener("click", async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        return;
      }

      if (isiOS) {
        iosHelp.style.display = "block";
        return;
      }

      location.href = continueBtn.href;
    });

    desktopAccessBtn.addEventListener("click", () => {
      localStorage.setItem("myservice_desktop_access", "1");
      const target = new URL(continueBtn.href, location.href);
      target.searchParams.set("desktop", "1");
      location.href = target.href;
    });

    window.addEventListener("appinstalled", () => {
      location.href = continueBtn.href;
    });
  </script>
</body>
</html>
