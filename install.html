<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MyService">
  <link rel="manifest" href="manifest.json">
  <title>Install MyService</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#f7f9fc;
      color:#10213d;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }
    .card{
      width:min(520px,100%);
      background:#fff;
      border:1px solid #dbe3ee;
      padding:32px;
      box-shadow:0 10px 28px rgba(16,33,61,.08);
      text-align:center;
    }
    .logo{font-size:36px;font-weight:800;letter-spacing:-1.4px;margin:0 0 10px}
    .logo span{color:#1677ff}
    h1{font-size:24px;margin:10px 0 8px}
    p{line-height:1.5;color:#66778e;margin:0 0 24px}

    .platform-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin:0 0 14px;
    }
    .platform-card{
      border:1px solid #cfd9e6;
      background:#fff;
      border-radius:12px;
      padding:15px 14px;
      display:flex;
      align-items:center;
      gap:12px;
      text-align:left;
      min-height:72px;
      cursor:pointer;
      transition:background .15s ease,border-color .15s ease;
    }
    .platform-card:hover{background:#f7faff;border-color:#9fbce5}
    .platform-card:active{background:#eef5ff}
    .platform-card strong{display:block;font-size:15px;color:#10213d}
    .platform-card span{display:block;font-size:12px;color:#73849b;margin-top:2px}

    .platform-icon{
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      font-size:20px;
      font-weight:800;
      flex:0 0 34px;
    }
    .apple-mark{
      background:#111;color:#fff;border-radius:9px;
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
      font-size:23px;
    }
    .android-mark{
      background:#edf8f0;color:#1f8f4e;border-radius:9px;position:relative;
    }
    .android-head{position:relative;display:block;width:23px;height:16px;background:#3ddc84;border-radius:10px 10px 5px 5px}
    .android-head:before,.android-head:after{content:"";position:absolute;top:-5px;width:2px;height:7px;background:#3ddc84;border-radius:2px}
    .android-head:before{left:5px;transform:rotate(-28deg)}
    .android-head:after{right:5px;transform:rotate(28deg)}
    .android-head i{position:absolute;top:6px;width:2px;height:2px;border-radius:50%;background:#fff}
    .android-head i:first-child{left:6px}.android-head i:last-child{right:6px}

    .ios{
      display:none;
      text-align:left;
      background:#f7f9fc;
      border:1px solid #dbe3ee;
      padding:14px;
      margin-top:12px;
      color:#334b68;
      line-height:1.5;
    }

    a.action,button.action{
      width:100%;
      border:1px solid #cfd9e6;
      background:#fff;
      color:#145ec1;
      padding:13px 16px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      text-decoration:none;
      display:block;
      margin-top:10px;
    }
    .small{font-size:12px;margin-top:14px;color:#8797aa}
    @media (max-width:380px){.platform-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">My<span>Service</span></div>
    <h1>Install MyService</h1>
    <p>Choose your device for the fastest install option.</p>

    <div class="platform-grid">
      <button id="iosInstallBtn" class="platform-card" type="button" aria-label="Install MyService on iOS">
        <div class="platform-icon apple-mark" aria-hidden="true"></div>
        <div>
          <strong>Quick install on iOS</strong>
          <span>iPhone & iPad</span>
        </div>
      </button>

      <button id="androidInstallBtn" class="platform-card" type="button" aria-label="Install MyService on Android">
        <div class="platform-icon android-mark" aria-hidden="true"><span class="android-head"><i></i><i></i></span></div>
        <div>
          <strong>Quick install on Android</strong>
          <span>Android devices</span>
        </div>
      </button>
    </div>

    <div id="iosHelp" class="ios">
      <strong>iPhone quick install</strong><br>
      Tap <strong>Share</strong> → <strong>Add to Home Screen</strong> → <strong>Add</strong>.
    </div>

    <div id="androidHelp" class="ios">
      <strong>Android quick install</strong><br>
      Tap your browser menu → <strong>Install app</strong>.
    </div>
    <div class="small">Install MyService directly from your browser.</div>
  </main>

  <script>
    let deferredPrompt = null;
    const iosInstallBtn = document.getElementById("iosInstallBtn");
    const androidInstallBtn = document.getElementById("androidInstallBtn");
    const iosHelp = document.getElementById("iosHelp");
    const androidHelp = document.getElementById("androidHelp");

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
    });

    iosInstallBtn.addEventListener("click", () => {
      androidHelp.style.display = "none";
      iosHelp.style.display = "block";
    });

    androidInstallBtn.addEventListener("click", async () => {
      iosHelp.style.display = "none";

      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        return;
      }

      androidHelp.style.display = "block";
    });
  </script>
</body>
</html>
